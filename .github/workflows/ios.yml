name: Build iOS and AltStore IPA

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec apps/ios/project.yml --project apps/ios
      - name: Build for iPhone and iPad
        run: |
          xcodebuild -project apps/ios/Omyaru.xcodeproj -scheme Omyaru \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/omyaru-ios-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA for AltStore Classic
        run: |
          mkdir -p "$RUNNER_TEMP/omyaru-package/Payload"
          ditto "$RUNNER_TEMP/omyaru-ios-build/Build/Products/Release-iphoneos/Omyaru.app" \
            "$RUNNER_TEMP/omyaru-package/Payload/Omyaru.app"
          cd "$RUNNER_TEMP/omyaru-package"
          zip -qry "$RUNNER_TEMP/Omyaru.ipa" Payload
          test -s "$RUNNER_TEMP/Omyaru.ipa"
      - name: Generate AltStore source
        run: python3 apps/ios/make_altstore_source.py "$RUNNER_TEMP/Omyaru.ipa" "$RUNNER_TEMP/altstore-source.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Omyaru-iOS-AltStore
          path: |
            ${{ runner.temp }}/Omyaru.ipa
            ${{ runner.temp }}/altstore-source.json
      - name: Publish preview IPA and stable AltStore source
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-latest >/dev/null 2>&1 || \
            gh release create ios-latest --title 'Omyaru iOS v0.1.0 Preview' \
              --notes 'iOS preview build for AltStore Classic. Android feature parity is in progress.' \
              --prerelease
          gh release upload ios-latest "$RUNNER_TEMP/Omyaru.ipa" \
            "$RUNNER_TEMP/altstore-source.json" --clobber
          gh release edit ios-latest --title 'Omyaru iOS v0.1.0 Preview'
