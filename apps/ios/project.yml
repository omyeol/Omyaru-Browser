name: Omyaru
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: NO
targets:
  Omyaru:
    type: application
    platform: iOS
    sources:
      - path: Omyaru
    configFiles:
      Debug: DriveSync.xcconfig
      Release: DriveSync.xcconfig
    dependencies:
      - target: OmyaruLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cuttan.omyaru.app
        INFOPLIST_FILE: Omyaru/Info.plist
        PRODUCT_NAME: Omyaru
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Omyaru/Omyaru-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/WireGuardLib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lomyaru_wg"
          - "-lresolv"
          - "-framework"
          - "Security"
  OmyaruLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: OmyaruLiveActivity
      - path: Omyaru/OmyaruSyncActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cuttan.omyaru.app.live-activity
        INFOPLIST_FILE: OmyaruLiveActivity/Info.plist
        PRODUCT_NAME: OmyaruLiveActivity
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
