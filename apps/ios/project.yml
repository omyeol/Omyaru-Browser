name: Omyaru
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: NO
targets:
  Omyaru:
    type: application
    platform: iOS
    sources:
      - path: Omyaru
    configFiles:
      Debug: DriveSync.xcconfig
      Release: DriveSync.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cuttan.omyaru.app
        INFOPLIST_FILE: Omyaru/Info.plist
        PRODUCT_NAME: Omyaru
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
